[project]
name = "vozena"
version = "0.4.1"
description = "Local voice processing for Blue Yeti calls on Fedora and PipeWire"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{name = "Caio Barbieri"}]
dependencies = ["PySide6==6.11.2"]

[project.urls]
Homepage = "https://caiolombello.github.io/vozena/"
Repository = "https://github.com/caiolombello/vozena"
Issues = "https://github.com/caiolombello/vozena/issues"

[project.scripts]
vozena = "yeti_voice.__main__:main"
yeti-voz = "yeti_voice.__main__:main"
