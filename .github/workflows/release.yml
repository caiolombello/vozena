name: Source release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  package:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag and build clean source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import ast
          import os
          from pathlib import Path
          tree = ast.parse(Path('yeti_voice/__init__.py').read_text())
          version = next(ast.literal_eval(node.value) for node in tree.body
                         if isinstance(node, ast.Assign)
                         and any(isinstance(target, ast.Name) and target.id == '__version__'
                                 for target in node.targets))
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag must match the application version')
          PY
          python3 scripts/build_release.py --output-dir dist
          cd dist
          sha256sum vozena-*-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    if: github.repository == 'caiolombello/vozena'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-release
          path: dist
      - name: Verify and publish source assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
              --pattern 'vozena-*-source.tar.gz' --pattern SHA256SUMS --dir existing
            for asset in vozena-*-source.tar.gz SHA256SUMS; do
              cmp "$asset" "existing/$asset"
            done
            echo 'Existing release assets match; no changes needed.'
          else
            gh release create "$RELEASE_TAG" vozena-*-source.tar.gz SHA256SUMS \
              --repo "$GH_REPO" --verify-tag --title "Vozena $RELEASE_TAG" \
              --notes 'Source release for Fedora 44 x86_64. Third-party binaries are downloaded separately from verified upstream archives. See README.md for installation and SHA256SUMS for asset integrity.'
          fi
