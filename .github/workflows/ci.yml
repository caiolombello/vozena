name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.distro }} offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Fedora 44
            image: registry.fedoraproject.org/fedora@sha256:b0d8e732ad7e4fc32b6c77e040c40be98a8092f237271d264cc8d36fd9674372
            setup: |
              dnf -y install python3 python3-pip git rpm cpio \
                pipewire pipewire-utils libsndfile libatomic libstdc++ \
                xcb-util-cursor mesa-libGL fontconfig libxkbcommon \
                libxkbcommon-x11 dbus-libs nodejs
          - distro: Ubuntu 26.04
            image: ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
            setup: |
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                python3 python3-pip python3-venv git cpio rpm2cpio \
                pipewire pipewire-bin libsndfile1 libatomic1 libstdc++6 \
                libxcb-cursor0 libgl1 libegl1 fontconfig libxkbcommon0 \
                libxkbcommon-x11-0 libdbus-1-3 nodejs
          - distro: Ubuntu 26.10
            image: ubuntu:26.10@sha256:93e29beff5257b2cdf1c024d831f6d2997e53655a653ff76a811fc9e6564a719
            setup: |
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                python3 python3-pip python3-venv git cpio rpm2cpio \
                pipewire pipewire-bin libsndfile1 libatomic1 libstdc++6 \
                libxcb-cursor0 libgl1 libegl1 fontconfig libxkbcommon0 \
                libxkbcommon-x11-0 libdbus-1-3 nodejs
    container:
      # Verified distribution container images with glibc >= 2.43
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      YETI_RUN_PIPEWIRE_TESTS: '0'
      YETI_RUN_DESKTOP_TESTS: '0'
    steps:
      - name: Install test dependencies
        run: ${{ matrix.setup }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified plugins and locked Python dependencies
        run: |
          python3 scripts/prepare.py --plugins-only
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Run unit, UI, and offline DSP tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Check static website JavaScript
        run: |
          while IFS= read -r -d '' script; do
            node --check "$script"
          done < <(find site -type f -name '*.js' -print0)
